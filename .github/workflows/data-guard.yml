name: data-guard

# Operational-data guard for pull requests, judged by main's code.
#
# pull_request_target always runs this file and its checker as they are on the default branch
# (main), whatever the PR changes; a PR that edits or deletes this workflow, tests.yml or
# tools/lock_guard.py is still judged by main's versions.  Security boundary:
#   * the PR's code is never checked out or executed: the job fetches git objects into a bare
#     repository (no working tree) and only reads them (git diff / show / log / merge-base);
#   * the only program run is tools/lock_guard.py extracted from main's commit (GITHUB_WORKFLOW_SHA),
#     with system python3 -I (stdlib only; no pip, no setup-python, no third-party action);
#   * no secrets; read-only job token (contents/actions: read), handed to the checker only for
#     restore PRs (it reads this run's environment approval); fetches are anonymous (public repo);
#   * every event value reaches the shell through env only, is quoted, and is validated (SHAs, PR
#     number, branch names) or passed as one argv token (--head-ref=..., --pr-author=...);
#   * restore PRs additionally wait for the pds-lock-restore environment approval (restore-gate).
# GitHub blocks pull_request_target in public repositories from 2026-12-02 unless an Actions event
# policy allows it: Settings > Actions > Policies, target only .github/workflows/data-guard.yml,
# allow only pull_request_target (README).  A blocked run never reports success (fail closed).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: data-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Explicit restore approval (handbook manual chapter 12).  Skipped for normal PRs.
  restore-gate:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'restore/') ||
      contains(github.event.pull_request.labels.*.name, 'lock-restore')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pds-lock-restore
    permissions: {}
    steps:
      - run: echo "lock restore approval recorded for this run; main's tools/lock_guard.py verifies it"

  guard:
    name: data-guard
    needs: restore-gate
    if: ${{ !cancelled() }}            # runs when the gate is skipped (normal PR) or rejected (then fails)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read                    # this run's environment approval (restore PRs only)
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Fetch main and the PR as git objects only (bare repository, no checkout)
        run: |
          set -euo pipefail
          for v in BASE_SHA HEAD_SHA GITHUB_WORKFLOW_SHA; do
            [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$v is not a commit SHA"; exit 1; }
          done
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad PR number"; exit 1; }
          for v in BASE_REF DEFAULT_BRANCH; do
            [[ "${!v}" =~ ^[A-Za-z0-9._/-]+$ && "${!v}" != *..* ]] || { echo "::error::$v is not a plain branch name"; exit 1; }
          done
          R="$RUNNER_TEMP/pds.git"
          git init -q --bare "$R"
          git -C "$R" config core.hooksPath /dev/null
          git -C "$R" fetch -q --no-tags --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/default" \
            "+refs/heads/$BASE_REF:refs/remotes/origin/base" \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          fetched=$(git -C "$R" rev-parse refs/remotes/pr/head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::PR head moved ($fetched, event $HEAD_SHA); the run for the new head decides"; exit 1
          fi
          for c in "$BASE_SHA" "$GITHUB_WORKFLOW_SHA"; do
            git -C "$R" cat-file -e "$c^{commit}" || { echo "::error::commit $c not found"; exit 1; }
          done

      - name: Prove the checker is main's (workflow source, executed blob vs main vs PR)
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/pds.git"; G="$RUNNER_TEMP/guard"; mkdir -p "$G"
          blob() { git -C "$R" rev-parse -q --verify "$1:$2" 2>/dev/null || echo "(없음)"; }
          on_main=false
          if git -C "$R" merge-base --is-ancestor "$GITHUB_WORKFLOW_SHA" refs/remotes/origin/default; then on_main=true; fi
          main_blob=$(blob "$GITHUB_WORKFLOW_SHA" tools/lock_guard.py)
          pr_blob=$(blob "$HEAD_SHA" tools/lock_guard.py)
          wf_main=$(blob "$GITHUB_WORKFLOW_SHA" .github/workflows/data-guard.yml)
          wf_pr=$(blob "$HEAD_SHA" .github/workflows/data-guard.yml)
          ran_blob="(추출 안 함)"; ran_sha="-"
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ] && [ "$on_main" = true ]; then
            git -C "$R" cat-file blob "$GITHUB_WORKFLOW_SHA:tools/lock_guard.py" > "$G/lock_guard.py"
            ran_blob=$(git -C "$R" hash-object --no-filters "$G/lock_guard.py")
            ran_sha=$(sha256sum "$G/lock_guard.py" | cut -c1-64)
          fi
          same() { [ "$1" = "$2" ] && echo "같음" || echo "다름 → 이번 실행에 쓰이지 않음(병합 후 적용)"; }
          {
            echo "## data-guard: 검사 코드 출처 (main 기준 실행 증명)"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이벤트 | \`$GITHUB_EVENT_NAME\` |"
            echo "| 워크플로 출처 | \`$WORKFLOW_REF\` @ \`$GITHUB_WORKFLOW_SHA\` |"
            echo "| 워크플로 커밋이 기본 브랜치 이력에 있음 | $on_main |"
            echo "| 실행할 lock_guard.py blob | \`$ran_blob\` (sha256 \`$ran_sha\`) |"
            echo "| main의 lock_guard.py blob | \`$main_blob\` |"
            echo "| PR head의 lock_guard.py blob | \`$pr_blob\` — $(same "$pr_blob" "$main_blob") |"
            echo "| main / PR의 data-guard.yml blob | \`$wf_main\` / \`$wf_pr\` — $(same "$wf_pr" "$wf_main") |"
            echo "| PR 코드 실행 | 없음: bare 저장소(작업 트리 없음), 실행 파일은 위 main blob 하나 |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$GITHUB_EVENT_NAME" = "pull_request_target" ] || { echo "::error::not a pull_request_target run"; exit 1; }
          [ "$on_main" = true ] || { echo "::error::workflow commit is not on $DEFAULT_BRANCH"; exit 1; }
          [ "$ran_blob" = "$main_blob" ] || { echo "::error::executed checker differs from main's"; exit 1; }

      - name: Operational data unchanged (normal PR) / verified restore (restore PR) — main's checker
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RESTORE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'lock-restore') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PDS_HALT_SEEN: ${{ vars.PDS_HALT || '' }}
          GH_TOKEN: >-
            ${{ (startsWith(github.event.pull_request.head.ref, 'restore/') ||
                 contains(github.event.pull_request.labels.*.name, 'lock-restore')) && github.token || '' }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/pds.git"; G="$RUNNER_TEMP/guard"
          mb=$(git -C "$R" merge-base "$BASE_SHA" "$HEAD_SHA")
          python3 -I "$G/lock_guard.py" --repo "$R" --base "$mb" --head "$HEAD_SHA" \
            --event="$GITHUB_EVENT_NAME" --head-ref="$HEAD_REF" --label="$RESTORE_LABEL" \
            --pr-author="$PR_AUTHOR" --guard-from "main \`${GITHUB_WORKFLOW_SHA:0:7}\`의 tools/lock_guard.py" \
            --report "$GITHUB_STEP_SUMMARY"
