name: tests

# Read-only CI for feature branches and pull requests.  It never writes to the repository and
# does not share the update-portfolio concurrency group, so production runs are unaffected.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # tests load run_pipeline.py from origin/main as the 'before' side
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml
      - name: Offline tests (synthetic data, before/after vs origin/main, fail-safe, workflow logic)
        env:
          PDS_BASE_REF: origin/main
          PDS_TEST_REPORT_DIR: test-report
        run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-offline
          path: test-report/
          if-no-files-found: ignore

  live:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml
      - name: Snapshot the live public inputs (author workbook, F2R state) for the report
        run: |
          python - <<'PY'
          import pathlib, pandas as pd, io, run_pipeline as R
          out = pathlib.Path("test-report/inputs"); out.mkdir(parents=True, exist_ok=True)
          wb = R._http_get(R.REF_WORKBOOK_URL); (out / "PDS_Portfolio_History_Current_Definition.xlsx").write_bytes(wb)
          (out / "f2r_public_state.json").write_bytes(R._http_get(R.F2R_STATE_URL))
          for name, df in pd.read_excel(io.BytesIO(wb), sheet_name=None).items():
              print(f"## {name}: {df.shape}; columns {list(df.columns)[:8]}")
              print(df.dtypes.head(6).to_string()); print(df.head(3).to_string()); print(df.tail(2).to_string())
          PY
      - name: Live 116-month before/after on real Yahoo / BLS / F2R / workbook data
        env:
          PDS_BASE_REF: origin/main
          PDS_LIVE_TEST: "1"
          PDS_TEST_REPORT_DIR: test-report
        run: python -m pytest tests/test_reference_only.py -q -rA -k live
      - name: Print the live report (also in the job summary)
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, pandas as pd
          r = pathlib.Path("test-report")
          c = r / "live_before_after.csv"
          if c.exists():
              d = pd.read_csv(c)
              print(f"### live 116-month before/after: {len(d)} months, {d.signal_month.min()}..{d.signal_month.max()}")
              print(f"- Core max |old-new| over all months: {d.core_max_abs_diff.max():.3g}; months with any Core diff: {(d.core_max_abs_diff > 0).sum()}")
              ch = d[d.adaptive_max_abs_diff > 1e-12]
              print(f"- months whose Adaptive target changes (old default -> reference_only): {len(ch)}")
              for _, x in ch.iterrows():
                  print(f"  - {x.signal_month}: {x.before_state} {x.before_rb:.4f} ({x.before_source}) -> {x.after_state} {x.after_rb:.4f} ({x.after_source}), one-way {x.adaptive_one_way_diff:.2%}")
          j = r / "live_new_on_committed_lock.json"
          if j.exists():
              print("### new code on the committed lock (today, real data)")
              print("```json"); print(j.read_text(encoding="utf-8")); print("```")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-live
          path: test-report/
          if-no-files-found: ignore
