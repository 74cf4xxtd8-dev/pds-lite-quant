name: update-portfolio

on:
  schedule:
    # Times are UTC. 22:40 UTC = 07:40 KST next morning, after the US close (20:00/21:00 UTC).
    - cron: "40 22 28-31 * *"   # month-end window: the run after the last session locks OFFICIAL
    - cron: "40 22 1-10 * *"    # days 1-10: retry until the month locks (holidays, Yahoo delays, and
                                #   the author's F2R Top-4, published 2-8 days after month-end)
    - cron: "40 22 * * 5"       # weekly Friday monitoring (PREVIEW refresh)
  push:                         # recompute when the engine or workflow changes (bot commits don't retrigger)
    branches: [main]
    paths: [run_pipeline.py, .github/workflows/update.yml, requirements.txt]
  workflow_dispatch:
    inputs:
      mode:
        description: "engine | reference"
        default: "engine"
      adaptive_mode:
        description: "reference_only (운용) | core_only (운용, 원작자 값 미반영) | reference_then_proxy·proxy (진단 전용, 커밋 안 함)"
        type: choice
        options: [reference_only, core_only, reference_then_proxy, proxy]
        default: reference_only
      commit:
        description: "결과를 저장소에 커밋 (운용 모드 + engine 실행 + 성공일 때만 실제로 커밋됨)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run pipeline (fails closed; JSON is only written if every check passes)
        id: run
        env:
          ADAPTIVE_MODE: ${{ github.event.inputs.adaptive_mode || 'reference_only' }}
          OFFICIAL_REQUIRES_F2R_PUBLISHED: "1"   # emergency override: "0" locks with F2R preview/proxy
        run: |
          set -o pipefail
          python run_pipeline.py --mode "${{ github.event.inputs.mode || 'engine' }}" 2>&1 | tee run.log

      - name: Record run status (readable without Actions UI)
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, datetime
          log = open("run.log", encoding="utf-8", errors="replace").read().splitlines() if os.path.exists("run.log") else []
          json.dump({"ok": os.environ["RUN_OUTCOME"] == "success",
                     "finished_utc": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
                     "event": os.environ.get("GITHUB_EVENT_NAME"), "run_url": os.environ["RUN_URL"],
                     "log_tail": [l for l in log if not l.startswith("[lock]")][-40:]},
                    open("docs/data/run_status.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Validation summary
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = "docs/data/portfolio_latest.json"
          if os.environ["RUN_OUTCOME"] != "success" or not os.path.exists(p):
              print("## 실행 실패: 새 JSON 미생성 (fail-closed). Run pipeline 단계 로그를 확인하세요."); raise SystemExit
          d = json.load(open(p)); v = d.get("validation", {})
          print(f"## PDS-Lite {d['mode']} · ADAPTIVE_MODE={d['config']['adaptive_mode']}")
          if v.get("months_checked"):
              print(f"- 원작자 Core 대조: **{v['exact_matches']}/{v['months_checked']}개월 일치**, 최대 오차 {v['max_abs_diff']:.2e}")
              for m in v.get("mismatches", []):
                  print(f"  - 불일치 {m['signal_month']}: {m['max_abs_diff']:.4f}")
          o = d["official"]
          print(f"- Official {o['signal_month']}→{o['holding_month']}: {o['state']} RB {o['risk_budget']:.2%}")
          lock = "docs/data/official_history.json"
          if os.path.exists(lock):
              h = json.load(open(lock))
              dfn = [f"{x['signal_month']}({x['risk_budget']:.2f}, {x['sources']['adaptive']})" for x in h if x["state"] == "DEFENSIVE"]
              print(f"- DEFENSIVE {len(dfn)}개월: " + (", ".join(dfn) if dfn else "없음"))
          print(f"- flags: {d['flags']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pds-lite-output
          path: docs/data/
          if-no-files-found: ignore

      - name: Commit if changed
        id: commit
        if: always() && github.event.inputs.commit != 'false'
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          RUN_MODE: ${{ github.event.inputs.mode || 'engine' }}
          ADAPTIVE_MODE: ${{ github.event.inputs.adaptive_mode || 'reference_only' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$RUN_OUTCOME" = "success" ] && [ "$RUN_MODE" = "engine" ] && \
             { [ "$ADAPTIVE_MODE" = "reference_only" ] || [ "$ADAPTIVE_MODE" = "core_only" ]; }; then
            git add docs/data
          else
            # fail-safe: a failed or diagnostic run may only record its status; anything else it
            # touched under docs/data is discarded so the last good official stays in force
            git ls-files -z docs/data | { grep -zv 'run_status.json$' || true; } | xargs -0 -r git checkout --
            git add docs/data/run_status.json
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional phone alert. Add repo secrets TELEGRAM_TOKEN and TELEGRAM_CHAT_ID to enable.
      - name: Telegram alert
        if: steps.run.outcome == 'success' && steps.commit.outputs.changed == 'true' && env.TG_TOKEN != ''
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          MSG=$(python - <<'PY'
          import json
          p = json.load(open("docs/data/portfolio_latest.json"))
          o = p["official"]; v = p.get("preview")
          top = ", ".join(f"{r['ticker']} {r['adaptive']*100:.1f}%" for r in o["us"][:5])
          s = f"[PDS-Lite] Official {o['signal_month']}→{o['holding_month']}: {o['state']} RB {o['risk_budget']*100:.0f}%\n{top}"
          if v: s += f"\nPreview {v['signal_month']}: {v['state']} RB {v['risk_budget']*100:.0f}%"
          if p["flags"]: s += "\n⚠ " + "; ".join(p["flags"])
          print(s)
          PY
          )
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}
          ${PAGES_URL}" > /dev/null

      - name: Telegram alert on failure
        if: always() && steps.run.outcome == 'failure' && env.TG_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAIL=$(tail -n 3 run.log 2>/dev/null | cut -c1-300)
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=[PDS-Lite] 실행 실패: 새 목표 비중 없음, 직전 Official 유지 (fail-closed)
          ${TAIL}
          ${RUN_URL}" > /dev/null
