name: probe-token-permissions
# Temporary, read-only: what can GITHUB_TOKEN see? (deleted right after the run)
on:
  push:
    branches: [probe-token-permissions]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          A: ${{ github.triggering_actor }}
          V: ${{ vars.PDS_HALT }}
        run: |
          echo "vars.PDS_HALT seen at run start: '${V}'  actor=${A}"
          for ep in "actions/variables/PDS_HALT" "actions/variables" "collaborators/${A}/permission" "collaborators" "actions/runs?status=in_progress&per_page=1" "actions/permissions/workflow" "environments" "branches/main/protection" "rulesets"; do
            code=$(curl -s -o /tmp/o.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/${ep}")
            echo "PROBE ${ep} -> ${code} $(head -c 200 /tmp/o.json | tr '\n' ' ')"
          done
